name: Mandar un aviso de prueba de Alerta Chollo

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mandar la notificación de prueba
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pip install --quiet pywebpush
          python scripts/avisos.py --prueba
